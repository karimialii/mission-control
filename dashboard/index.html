<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mission Control: supervise AI executors across your projects.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%235ac8fa%22/%3E%3Cstop offset=%221%22 stop-color=%22%235856d6%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22url(%23g)%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%227%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222.5%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%222.5%22 fill=%22white%22/%3E%3C/svg%3E">
<title>Mission Control</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f5f5f7; --side:rgba(236,236,240,.78); --panel:#ffffff; --panel2:#f2f2f5; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --line:rgba(0,0,0,.07); --line2:rgba(0,0,0,.13);
  --text:#1d1d1f; --mute:#6e6e73; --dim:#a1a1a6;
  --blue:#007aff; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --pink:#ff2d55; --purple:#af52de; --indigo:#5856d6; --teal:#30b0c7;
  --s-todo:#8e8e93; --s-running:var(--blue); --s-review:var(--purple); --s-needs_changes:var(--orange);
  --s-blocked:var(--pink); --s-done:var(--green); --s-cancelled:#c7c7cc; --crit:var(--red);
  /* legacy names used in markup */
  --cyan:var(--blue); --violet:var(--purple); --magenta:var(--pink); --lime:var(--green); --amber:var(--orange);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro",system-ui,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --r:14px; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --ease:cubic-bezier(.32,.72,0,1);
  --z-side:5; --z-tool:6; --z-scrim:20; --z-drawer:21; --z-toast:40;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161618; --side:rgba(32,32,36,.72); --panel:#1f1f22; --panel2:#2a2a2e; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.14);
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --text:#f5f5f7; --mute:#98989d; --dim:#636366;
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --pink:#ff375f; --purple:#bf5af2; --indigo:#5e5ce6; --teal:#40c8e0;
  --s-cancelled:#48484a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.47 var(--ui);letter-spacing:-.006em;overflow:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select,textarea,input{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--fill);border-radius:10px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:240px 1fr;height:100dvh}
/* sidebar */
.sidebar{background:var(--side);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px 12px;gap:2px;overflow:auto;z-index:var(--z-side)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px}
.brand .icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(160deg,#5ac8fa,#007aff 55%,#5856d6);box-shadow:0 1px 3px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.35)}
.brand .icon svg{width:18px;height:18px;color:#fff}
.brand b{font:600 15px var(--display);letter-spacing:-.01em}
.side-sec{font:600 11px var(--ui);color:var(--mute);padding:14px 10px 4px}
#nav{display:flex;flex-direction:column;gap:1px}
#nav button,.pitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;cursor:pointer;padding:6px 10px;border-radius:8px;text-align:left;color:var(--text);font-size:13.5px;transition:background .15s}
#nav button svg{width:18px;height:18px;color:var(--blue);flex:none}
#nav button:hover,.pitem:hover{background:var(--fill2)}
#nav button.active,.pitem.active{background:var(--fill)}
#nav button span{flex:1}
#nav .badge,.pitem .badge{min-width:18px;height:18px;padding:0 6px;border-radius:9px;background:var(--red);color:#fff;font:600 11px var(--ui);display:grid;place-items:center}
.pwrap{position:relative}
.pwrap .pitem{padding-right:30px}
.premove-s{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:20px;height:20px;border:0;border-radius:50%;background:none;color:var(--mute);cursor:pointer;font-size:15px;line-height:1;display:grid;place-items:center;opacity:0;transition:opacity .15s,background .15s}
.pwrap:hover .premove-s,.premove-s:focus-visible{opacity:1}
.premove-s:hover{background:var(--fill);color:var(--red)}
.pwrap:hover .pct,.pwrap:hover .badge{opacity:0}
.premove{margin-top:12px;color:var(--mute);background:none}
.premove:hover{color:var(--red);background:var(--fill2)}
.pitem .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--s-todo)}
.pitem .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .pct{font-size:12px;color:var(--mute)}
.side-add{margin-top:auto;color:var(--blue) !important}
/* content column */
.content{display:flex;flex-direction:column;min-width:0;height:100dvh}
.toolbar{display:flex;align-items:center;gap:12px;padding:12px 28px;min-height:60px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);z-index:var(--z-tool)}
.tb-title{min-width:0;display:flex;flex-direction:column}
.tb-title h2{margin:0;font:600 15px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title small{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.proj-select{display:none}
.hstats{display:flex;gap:18px;margin-left:auto;align-items:center}
.chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.chip small{font-size:11px;color:var(--mute)}
.chip span{font:600 15px var(--display)}
.supchip span{display:flex;align-items:center;gap:6px}
.supchip .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.supchip.live .dot{background:var(--blue);animation:breathe 1.4s ease-in-out infinite}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13px}
.toggle small{font-size:13px;color:var(--text)}
.sw{width:38px;height:23px;border-radius:12px;background:var(--fill);position:relative;transition:background .25s var(--ease)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2),0 0 1px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.toggle.on .sw{background:var(--green)}
.toggle.on .sw::after{transform:translateX(15px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--fill2);color:var(--text);padding:7px 14px;border-radius:980px;cursor:pointer;font-size:13px;font-weight:500;transition:background .15s,transform .1s,opacity .15s;white-space:nowrap}
.btn:hover{background:var(--fill)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.38;cursor:default;transform:none}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:color-mix(in srgb,var(--blue) 88%,#000)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 11px;font-size:12px}

main{flex:1;overflow:auto;scroll-behavior:smooth}
.wrap{max-width:1280px;margin:0 auto;padding:26px 32px 64px}
.view-title{display:flex;align-items:flex-end;gap:16px;margin:0 0 20px;flex-wrap:wrap}
.view-title > div:first-child{flex:1;min-width:240px}
.view-title h1{font:700 30px/1.15 var(--display);letter-spacing:-.022em;margin:0}
.view-title p{margin:4px 0 0;color:var(--mute);font-size:14px;max-width:68ch;text-wrap:pretty}
.panel{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);position:relative}
.label{font:600 12px var(--ui);color:var(--mute)}
.mono{font-family:var(--mono);font-size:.94em}
.muted{color:var(--mute)}
.empty{padding:48px 24px;text-align:center;color:var(--mute);background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow)}
.empty code{font-family:var(--mono);color:var(--text)}
.status{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--ui);padding:2px 9px 2px 8px;border-radius:980px;background:color-mix(in srgb,currentColor 13%,transparent);white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.running::before{animation:breathe 1.4s ease-in-out infinite}
.tag{font:500 11.5px var(--ui);padding:2px 8px;border-radius:6px;background:var(--fill2);color:var(--mute);white-space:nowrap}
.bar{height:4px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--blue);transition:width .6s var(--ease)}
@keyframes breathe{50%{opacity:.35}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wrap > *{animation:rise .35s var(--ease) both}

/* overview */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pcard{padding:20px;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.08)}
.pcard.current{box-shadow:0 0 0 2px var(--blue),var(--shadow)}
.pcard h3{margin:0 0 4px;font:600 17px var(--display);letter-spacing:-.01em}
.pcard .goal{color:var(--mute);font-size:13px;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .row{display:flex;align-items:center;gap:18px;margin-top:14px}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 16px var(--display)}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;flex:1}
.mini-stats div{display:flex;flex-direction:column}
.mini-stats small{font-size:11px;color:var(--mute)}
.mini-stats span{font:600 15px var(--display)}
.needs{position:absolute;top:18px;right:18px;font:600 11px var(--ui);color:#fff;background:var(--red);padding:3px 9px;border-radius:980px}
.addcard{cursor:default;background:transparent;box-shadow:none;border:1.5px dashed var(--line2)}
.addcard:hover{transform:none;box-shadow:none}
.pcard .ignite-mini{margin-top:16px;width:100%}

/* phases */
.phase-strip{display:flex;gap:12px;margin-bottom:16px;overflow-x:auto;padding:2px 2px 6px}
.phase-chip{flex:none;padding:12px 16px;min-width:160px}
.phase-chip .n{font:700 22px var(--display);letter-spacing:-.02em}
.phase-chip .bar{margin-top:8px}
.gantt-wrap{overflow:auto;padding:8px 4px 4px}
.gantt text{font-family:var(--ui)}
.gantt .bar-r{cursor:pointer}
.gantt .bar-r:hover rect.b{fill-opacity:.26}
.gantt .run{animation:breathe 1.6s ease-in-out infinite}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.gstats{display:flex;gap:6px;flex-wrap:wrap}
.approve{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:18px 20px;margin-bottom:18px;flex-wrap:wrap;background:color-mix(in srgb,var(--blue) 8%,var(--panel))}
.btn.launch{padding:10px 20px;font-size:14px}

/* board */
.board{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px;min-height:60vh}
.col{padding:4px;display:flex;flex-direction:column;gap:10px;background:transparent;box-shadow:none}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 6px 4px}
.col-h b{font:600 13px var(--ui);display:flex;align-items:center;gap:7px}
.col-h .cdot{width:8px;height:8px;border-radius:50%}
.col-h span{font-size:12px;color:var(--mute);margin-left:auto}
.card{padding:14px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s}
.card:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 10px 26px rgba(0,0,0,.08)}
.card .id{font:500 11.5px var(--mono);color:var(--mute)}
.card h4{margin:3px 0 10px;font-size:14px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card .step{font-size:12px;color:var(--mute);margin:10px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-actions{display:flex;gap:6px;margin-top:12px}

/* agents */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.agent{padding:18px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.agent-h{display:flex;gap:12px;align-items:center}
.avatar{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font:600 14px var(--display);flex:none;color:#fff !important;background:var(--s-todo) !important}
.avatar.live{background:linear-gradient(160deg,#5ac8fa,var(--blue)) !important}
.term{background:var(--panel2);border-radius:10px;padding:10px 12px;font:12px/1.6 var(--mono);height:132px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;color:var(--mute)}
.term div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-tool{color:var(--blue)} .k-text{color:var(--text)} .k-system{color:var(--mute)} .k-error{color:var(--red)}
.agent .nums{display:flex;gap:16px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.agent .nums b{color:var(--text);font-weight:600}
.roster{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.roster .tag{padding:5px 10px}

/* tokens */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:18px}
.kpi .v{font:700 28px/1.1 var(--display);margin-top:6px;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--mute);margin-top:4px}
.tok-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.hbars{padding:18px;display:flex;flex-direction:column;gap:12px}
.hb{display:grid;grid-template-columns:180px 1fr 120px;gap:12px;align-items:center;font-size:13px;cursor:pointer}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .track{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--fill2);gap:1px}
.hb .track i{height:100%;display:block}
.hb .val{font-size:12px;text-align:right;color:var(--mute)}

/* feed */
.feed{padding:4px 0;overflow:hidden}
.ev{display:grid;grid-template-columns:76px 28px 1fr;gap:12px;padding:10px 18px;align-items:center}
.ev + .ev{border-top:1px solid var(--line)}
.ev[data-task]:hover{background:var(--fill2)}
.ev time{font-size:12px;color:var(--dim)}
.ev .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:color-mix(in srgb,currentColor 14%,transparent)}
.ev .who{font-weight:600;margin-right:6px}
.filters{display:inline-flex;gap:2px;margin-bottom:14px;padding:2px;background:var(--fill2);border-radius:9px}
.filters button{border:0;background:none;border-radius:7px;padding:5px 14px;cursor:pointer;font-size:13px;color:var(--text);text-transform:capitalize}
.filters button.on{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* chat (Messages style) */
.comms{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.chat{display:flex;flex-direction:column;height:calc(100dvh - 210px);min-height:420px;overflow:hidden}
.chat-log{flex:1;overflow:auto;padding:20px 18px;display:flex;flex-direction:column;gap:4px}
.msg{max-width:78%;padding:8px 13px;border-radius:18px;font-size:14.5px;line-height:1.42;margin-top:8px}
.msg .who{font-size:11px;color:var(--mute);margin:0 4px 3px}
.msg .who span{margin-left:4px;color:var(--dim)}
.msg.sup{background:var(--panel2);align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.msg.me .who,.msg.me .who span{color:rgba(255,255,255,.75)}
.msg.sys{align-self:center;max-width:90%;font-size:12px;color:var(--mute);background:none;text-align:center;padding:6px 10px}
.md-lite p{margin:3px 0}.md-lite h3{font-size:14px;margin:10px 0 4px}.md-lite code{font-family:var(--mono);font-size:12.5px;background:var(--fill2);padding:1px 5px;border-radius:5px}.md-lite pre{background:var(--fill2);padding:8px 10px;border-radius:8px;overflow:auto;font:12px var(--mono)}
.dots{display:flex;gap:4px;padding:6px 2px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:breathe 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.composer{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{min-height:40px;max-height:180px;border-radius:20px;padding:9px 16px}
.composer .btn{border-radius:50%;width:36px;height:36px;padding:0;font-size:0}
.composer .btn::after{content:"";width:16px;height:16px;background:#fff;-webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 4l-7 7h4.5v9h5v-9H19z"/></svg>') center/contain no-repeat;mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 4l-7 7h4.5v9h5v-9H19z"/></svg>') center/contain no-repeat}
.qcard{padding:18px;margin-bottom:14px}
.qcard.urgent{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--orange) 60%,transparent),var(--shadow)}
.qcard h4{margin:6px 0 10px;font-size:15px;font-weight:600}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.opt{border:0;background:var(--fill2);padding:8px 14px;border-radius:980px;cursor:pointer;transition:background .15s,transform .1s}
.opt:hover{background:var(--fill)}
.opt:active{transform:scale(.97)}
.opt.rec{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.opt.rec::after{content:" · suggested";font-size:12px;opacity:.75}
textarea,.inp{width:100%;background:var(--panel2);border:1px solid transparent;border-radius:10px;padding:9px 12px;outline:none;transition:border-color .15s,box-shadow .15s;color:var(--text)}
textarea{min-height:70px;resize:vertical}
textarea:focus,.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.inp{flex:1;min-width:0;font-size:13px}
.qscroll{max-height:min(460px,52vh);overflow-y:auto;overscroll-behavior:contain}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.lrow + .lrow{border-top:1px solid var(--line)}
.lrow .sel{width:auto;min-width:118px}
.wrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0}
.wrow + .wrow{border-top:1px solid var(--line)}
.wrow.done{align-items:center;font-size:13px}
.ulist td{vertical-align:middle}
.ulist tr.clk{cursor:pointer}.ulist tr.clk:hover td{background:var(--fill2)}
.ulist tr.open td{background:var(--fill2)}
.ulist tr.detail td{background:var(--panel2);padding:0}
.thread{padding:12px 16px}
.thread + .thread{border-top:1px solid var(--line)}
.bubble{padding:7px 12px;border-radius:16px;margin-top:6px;font-size:13px;max-width:92%;width:fit-content}
.bubble.q{background:var(--panel2);border-bottom-left-radius:5px}
.bubble.a{background:var(--blue);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.bubble small{display:block;font-size:11px;opacity:.7;margin-bottom:1px}
.picker{display:flex;flex-direction:column;gap:14px}
.mhint{font-size:12px;color:var(--mute);line-height:1.4;margin-top:2px}.mhint b{color:var(--text);font-weight:600}
.warn{font-size:12.5px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--orange) 14%,transparent);color:var(--text)}
.mcell{display:flex;flex-direction:column;gap:6px}.mcell .sel{width:100%}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:8px 10px;align-items:start}
.prow > div:first-child{grid-column:1/-1;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.prow .mhint{grid-column:1/-1;padding:0 2px 6px}
.prow + .prow{border-top:1px solid var(--line);padding-top:14px}
.sel{appearance:none;background:var(--panel2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M1 1l4 4 4-4" stroke="%238e8e93" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>') no-repeat right 10px center;border:0;border-radius:8px;padding:7px 28px 7px 10px;cursor:pointer;font-size:13px}
.prow .sel{width:100%}

/* permissions */
.clone-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.pcard{padding:18px 18px 14px}
.pc-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pc-title{font-size:15px;font-weight:600}
.pc-sub{font-size:12.5px;color:var(--mute);margin-top:2px;overflow-wrap:anywhere}
.pc-list{margin:12px 0 4px;border-top:1px solid var(--line,var(--fill2))}
.pr{padding:10px 0;border-bottom:1px solid var(--line,var(--fill2));display:grid;gap:4px}
.pr-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.pr-top label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;min-width:0}
.pr code{font-size:11.5px;color:var(--mute);overflow-wrap:anywhere}
.pr-risk{font-size:12.5px;color:var(--text);opacity:.82}
.risk{font-size:11px;font-weight:600;padding:2px 8px;border-radius:980px;white-space:nowrap}
.risk.low{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.risk.medium{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.risk.high{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.pc-actions{display:flex;gap:8px;margin-top:12px}
.pc-reply{margin-top:10px;font-size:12.5px;color:var(--mute)}
.pc-reply summary{cursor:pointer;width:max-content}
.pc-reply textarea{margin-top:8px}
.approve-perms{flex-basis:100%;margin-top:2px}
.rules{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.rules code{background:var(--fill2);padding:3px 8px;border-radius:6px;font-size:12px}
.rule{display:inline-flex;align-items:center;gap:2px;background:var(--fill2);border-radius:6px;padding-right:2px}
.rule code{background:none}
.x2{border:0;background:none;color:var(--mute);cursor:pointer;font-size:15px;line-height:1;padding:2px 6px;border-radius:6px}
.x2:hover{color:var(--red)}

/* people */
.av{position:relative;display:inline-grid;place-items:center;border-radius:50%;background:linear-gradient(160deg,#ffcc00,#ff9500);color:#fff;font-weight:600;overflow:hidden;flex:none;vertical-align:middle}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag.person{display:inline-flex;align-items:center;gap:5px;color:var(--text);padding-left:3px}
.sec.person-box{flex-direction:row;align-items:center;gap:12px;padding:12px 14px;background:var(--panel2);border-radius:12px}
.approve.pr{background:color-mix(in srgb,var(--green) 8%,var(--panel))}
code{font-family:var(--mono);font-size:.92em}

/* ignite */
.ignite{max-width:600px;margin:7vh auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.appicon{width:104px;height:104px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(160deg,#5ac8fa,#007aff 55%,#5856d6);box-shadow:0 10px 30px rgba(0,122,255,.3),inset 0 1px 0 rgba(255,255,255,.35)}
.appicon svg{width:54px;height:54px;color:#fff}
.ignite h1{font:700 32px var(--display);letter-spacing:-.025em;margin:22px 0 0}
.ignite .pitch{font-size:17px;line-height:1.5;color:var(--mute);margin:12px 0 10px;text-wrap:balance}
.ignite .pitch b{color:var(--text);font-weight:600}
.ignite .peek{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 20px}
.ignite-btn{font-size:17px;font-weight:600;padding:13px 30px}

/* drawer (inspector sheet) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:var(--z-scrim);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:10px;right:10px;bottom:10px;width:min(600px,calc(100vw - 20px));z-index:var(--z-drawer);background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25),0 0 0 1px var(--line);transform:translateX(calc(100% + 20px));transition:transform .45s var(--ease);display:flex;flex-direction:column;overflow:hidden}
.drawer.on{transform:none}
.drawer-h{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer-h h2{margin:2px 0 10px;font:700 21px var(--display);letter-spacing:-.018em}
.drawer-b{overflow:auto;padding:18px 22px 40px;display:flex;flex-direction:column;gap:18px}
.x{margin-left:auto;background:var(--fill2);border:0;border-radius:50%;width:28px;height:28px;cursor:pointer;color:var(--mute);flex:none;font-size:12px}
.x:hover{background:var(--fill)}
.sec{display:flex;flex-direction:column;gap:6px}
.sec ul{margin:0;padding-left:18px}
.md{background:var(--panel2);border-radius:10px;padding:12px 14px;font-size:13px;overflow-wrap:anywhere}
.md h1,.md h2,.md h3{font-size:13px;margin:0 0 6px}
.md p{margin:4px 0}
.md code{font-family:var(--mono);font-size:12px;background:var(--fill2);padding:1px 5px;border-radius:4px}
.md pre{background:var(--fill2);padding:8px;border-radius:8px;overflow:auto;font:12px var(--mono);margin:6px 0}
.logbox{background:var(--panel2);border-radius:10px;padding:10px 12px;font:12px/1.6 var(--mono);height:300px;overflow:auto}
.logbox .ln{display:grid;grid-template-columns:62px 1fr;gap:8px;white-space:pre-wrap;word-break:break-word}
.logbox .ln time{color:var(--dim)}
.att{width:100%;border-collapse:collapse;font-size:12.5px}
.att td,.att th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.att th{font-weight:600;font-size:11.5px;color:var(--mute)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(12px) scale(.96);opacity:0;transition:all .35s var(--ease);z-index:var(--z-toast);padding:10px 18px;border-radius:14px;background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.18),0 0 0 1px var(--line);font-weight:500;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{color:var(--red)}
.offline{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:var(--z-toast);padding:6px 14px;border-radius:980px;background:var(--red);color:#fff;font-size:12px;font-weight:600;display:none}

@media (max-width:1100px){.tok-grid,.comms{grid-template-columns:1fr}.hstats .opt-hide{display:none}}
@media (max-width:760px){
  body{overflow:auto}
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;flex-direction:row;padding:4px 6px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);overflow-x:auto}
  .sidebar > :not(#nav){display:none}
  #nav{flex-direction:row;justify-content:space-around;width:100%}
  #nav button{flex-direction:column;gap:2px;font-size:10px;padding:5px 4px;width:auto;min-width:52px;color:var(--mute)}
  #nav button.active{background:none;color:var(--blue)}
  #nav button svg{width:22px;height:22px;color:inherit}
  #nav .badge{position:absolute;margin:-2px 0 0 22px;height:16px;min-width:16px;font-size:10px}
  #nav button{position:relative}
  .content{height:auto;min-height:100dvh;padding-bottom:64px}
  .toolbar{position:sticky;top:0;flex-wrap:wrap;padding:10px 16px;gap:10px}
  .tb-title{display:none}
  .proj-select{display:block;flex:1;min-width:0;font-weight:600;font-size:15px;background-color:var(--fill2)}
  .hstats{width:100%;margin:0;gap:14px;overflow-x:auto;justify-content:space-between}
  .chip{align-items:flex-start}
  .wrap{padding:20px 16px 40px}
  .view-title h1{font-size:26px}
  .board{grid-template-columns:repeat(6,82vw)}
  .agents,.grid-cards{grid-template-columns:1fr}
  .hb{grid-template-columns:96px 1fr 92px}
  .ev{grid-template-columns:52px 24px 1fr;padding:9px 12px}
  .chat{height:calc(100dvh - 330px);min-height:380px}.msg{max-width:88%}
  .prow{grid-template-columns:1fr}
  .drawer{top:auto;left:0;right:0;bottom:0;width:100%;height:88dvh;border-radius:18px 18px 0 0;transform:translateY(105%)}
}
/* ── launch sequence ── Plain CSS animation, deliberately not gated on prefers-reduced-motion:
   Windows "Show animations" = off would otherwise switch it off, and this one is meant to always play. */
#boot{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;cursor:default;
  --e:cubic-bezier(.22,1,.36,1)}
#boot .stage{display:flex;flex-direction:column;align-items:center;gap:26px}
#boot .mark{position:relative;width:104px;height:104px;border-radius:24px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(160deg,#4da3ff 0%,#007aff 55%,#5856d6 100%);
  box-shadow:0 1px 1px rgba(0,0,0,.08),0 18px 44px -10px rgba(0,122,255,.55),inset 0 1px 0 rgba(255,255,255,.35);
  opacity:0;transform:scale(.86);animation:bMark 1.1s .15s var(--e) forwards}
#boot .mark::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);
  background-size:260% 100%;background-position:130% 0;animation:bSheen 1.2s .85s var(--e) forwards}
#boot .mark svg{width:60px;height:60px;overflow:visible}
#boot .mark .g{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
#boot .mark .g1{animation:bDraw .9s .45s var(--e) forwards}
#boot .mark .g2{animation:bDraw .5s .9s var(--e) forwards}
#boot .mark .dot{fill:currentColor;opacity:0;transform-origin:12px 12px;transform:scale(.3);animation:bPop .6s .8s var(--e) forwards}
#boot .name{font:600 26px/1 var(--display);letter-spacing:-.02em;color:var(--text);opacity:0;transform:translateY(8px);filter:blur(6px);animation:bName .9s .8s var(--e) forwards}
#boot .sub{font:400 13px/1 var(--ui);color:var(--mute);margin-top:-14px;opacity:0;animation:bSub .8s 1.1s var(--e) forwards}
@keyframes bMark{to{opacity:1;transform:none}}
@keyframes bSheen{to{background-position:-30% 0}}
@keyframes bDraw{to{stroke-dashoffset:0}}
@keyframes bPop{to{opacity:1;transform:none}}
@keyframes bName{to{opacity:1;transform:none;filter:none}}
@keyframes bSub{to{opacity:1}}
#boot.out{animation:bOut .7s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}
#boot.out .stage{animation:bStageOut .7s cubic-bezier(.4,0,.2,1) forwards}
@keyframes bOut{to{opacity:0}}
@keyframes bStageOut{to{transform:scale(1.08);filter:blur(8px)}}
.app.reveal{animation:bApp .9s var(--e) both}
@keyframes bApp{from{opacity:.0;transform:scale(.985)}to{opacity:1;transform:none}}
/* ── chat ── */
.comms{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.comms.solo{grid-template-columns:minmax(0,1fr);max-width:920px;margin:0 auto}
.chat{height:calc(100dvh - 200px);position:relative}
.chat-log{scroll-behavior:auto;overscroll-behavior:contain;padding:18px 20px 24px}
.msg{max-width:82%}
.msg.sup{max-width:88%}
.msg.cont{margin-top:3px}
.msg.me.cont{border-top-right-radius:8px}.msg.sup.cont{border-top-left-radius:8px}
.dayline{display:flex;align-items:center;gap:10px;margin:14px 0 4px;color:var(--mute);font-size:11.5px}
.dayline::before,.dayline::after{content:"";flex:1;height:1px;background:var(--line)}
.chat-empty{margin:auto;text-align:center;max-width:380px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.chat-empty .big{font-size:34px}
.jump{position:absolute;right:18px;bottom:86px;border:0;border-radius:980px;padding:7px 13px;background:var(--blue);color:#fff;font:600 12.5px var(--ui);box-shadow:var(--shadow);cursor:pointer;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .15s,transform .15s}
.jump.on{opacity:1;transform:none;pointer-events:auto}
.composer textarea{resize:none;overflow-y:auto}
.composer-hint{font-size:11px;color:var(--dim);padding:0 18px 8px;text-align:right}
.side{max-height:calc(100dvh - 200px);overflow:auto;padding-right:2px}
@media(max-width:960px){.comms{grid-template-columns:minmax(0,1fr)}.side{max-height:none}}
/* ── settings ── */
.settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media(max-width:1000px){.settings{grid-template-columns:minmax(0,1fr)}}
.mode{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;margin-top:8px;cursor:pointer;background:var(--fill2)}
.mode.on{box-shadow:0 0 0 1.5px var(--blue)}
.mode input{margin-top:3px;accent-color:var(--blue)}
.snap{border-top:1px solid var(--line)}
.tgroup + .snap{border-top:0}
.snaprow{display:flex;gap:10px;align-items:center;padding:8px 2px;cursor:pointer}
.snaprow .tx{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snapbody{padding:4px 2px 12px}
.chrow{display:flex;gap:8px;align-items:center;padding:3px 0}
.chrow .tx{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font:700 10.5px var(--mono);width:18px;text-align:center;border-radius:4px;padding:1px 0}
.st-M{color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,transparent)}
.st-D{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.st-A{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
/* ── today ── */
.today{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:960px){.today{grid-template-columns:minmax(0,1fr)}}
.tpanel{padding:18px;margin-bottom:16px}
.tpanel h3{margin:0 0 4px;font:600 15px var(--display)}
.tgroup{font:600 11.5px var(--ui);color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 2px}
.tgroup.late{color:var(--red)}
.trow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.tgroup + .trow{border-top:0}
.trow input[type=checkbox]{margin-top:3px;flex:none;width:16px;height:16px;accent-color:var(--green)}
.trow .tx{flex:1;min-width:0;font-size:13.5px;line-height:1.4;overflow-wrap:anywhere}
.trow.done .tx{color:var(--mute);text-decoration:line-through}
.trow .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tadd{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tadd .inp{flex:1 1 200px}
.tadd .sel,.tadd input[type=date],.tadd input[type=datetime-local]{flex:0 1 auto;width:auto}
.scard{padding:14px 16px;border-radius:12px;background:var(--fill2);margin-top:10px}
.scard .subj{font-weight:600;font-size:13.5px}
.scard .why{font-size:12px;color:var(--mute);margin-top:2px}
.sitem{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:13px}
.sitem .tx{flex:1;min-width:0}
.conf{font:600 10.5px var(--ui);padding:2px 7px;border-radius:6px;text-transform:uppercase}
.conf.high{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.conf.medium{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.conf.low{background:color-mix(in srgb,var(--pink) 16%,transparent);color:var(--pink)}
.ibtn{border:0;background:var(--panel);color:var(--text);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;flex:none}
.ibtn.ok{color:var(--green)} .ibtn:hover{background:var(--fill)}
.mrow{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .mt{flex:none;width:46px;font-size:12.5px;line-height:1.35}
.mrow .mt span{color:var(--mute);font-size:11.5px}
.mrow .mb{flex:1;min-width:0}
.mrow .mtitle{font-size:13.5px;font-weight:500;overflow-wrap:anywhere}
.mrow.past{opacity:.45}
.mrow.live .mtitle{color:var(--green)}
.mrow.free .mtitle{font-weight:400;color:var(--mute)}
.nowline{display:flex;align-items:center;gap:8px;color:var(--red);font:600 11px var(--ui);margin:2px 0}
.nowline::after{content:"";flex:1;height:1.5px;background:var(--red)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.wday{border:0;background:var(--fill2);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--text)}
.wday small{font-size:10.5px;color:var(--mute)} .wday b{font:600 14px var(--display)} .wday i{font-style:normal;font-size:10px;color:var(--mute)}
.wday.on{background:var(--blue);color:#fff} .wday.on small,.wday.on i{color:rgba(255,255,255,.8)}
.ibtn:disabled{opacity:.35;cursor:default}
.tdone{overflow-y:auto;overscroll-behavior:contain}
.tdone .trow:first-child{border-top:0}
.tnotes{width:100%;min-height:120px;resize:vertical}
.needrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.needrow:first-of-type{border-top:0}
</style>
</head>
<body>
<div id="boot" aria-hidden="true">
  <div class="stage">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none"><circle class="g g1" pathLength="1" cx="12" cy="12" r="8"/><path class="g g2" pathLength="1" d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/><circle class="dot" cx="12" cy="12" r="3"/></svg></div>
    <div class="name">Mission Control</div>
    <div class="sub">Plan with the best. Build with the rest.</div>
  </div>
</div>
<div class="app">
  <aside class="sidebar" aria-label="Navigation">
    <div class="brand"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg></div><b>Mission Control</b></div>
    <nav id="nav"></nav>
    <div class="side-sec">Projects</div>
    <div id="projList"></div>
    <button class="pitem side-add" id="sideAdd">＋ Add Project…</button>
  </aside>
  <div class="content">
    <header class="toolbar">
      <div class="tb-title"><h2 id="tbTitle">Mission Control</h2><small id="tbSub"></small></div>
      <select class="proj-select sel" id="projSel" aria-label="Project"></select>
      <div class="hstats" id="hstats"></div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Task details"></aside>
<div class="toast" id="toast"></div>
<div class="offline" id="offline">Can’t reach the dashboard server. Retrying…</div>

<script>
const TOKEN = "__MC_TOKEN__";
const STATUS = ["todo","running","review","needs_changes","blocked","done"];
const SLABEL = {todo:"Todo",running:"Running",review:"Review",needs_changes:"Needs changes",blocked:"Blocked",done:"Done",cancelled:"Cancelled"};

async function api(path){ const r = await fetch(path); if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error || r.status); return r.json(); }
async function post(path, body){
  const r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-MC-Token":TOKEN},body:JSON.stringify({p:S.cur,...body})});
  const j = await r.json().catch(()=>({})); if(!r.ok){ if(!j.suggest_target) toast(j.error||"failed", true); const err=new Error(j.error); err.data=j; throw err; } return j;
}

/* ───────── polling ───────── */
async function loadProjects(){
  S.projects = await api("/api/projects");
  if(!S.cur || !S.projects.find(p=>p.path===S.cur)){
    const saved = lsGet("mc.project");
    S.cur = (S.projects.find(p=>p.path===saved) || [...S.projects].sort((a,b)=>b.updated.localeCompare(a.updated))[0] || {}).path || null;
  }
  const sel = $("projSel");
  const opts = S.projects.map(p=>`<option value="${esc(p.path)}" ${p.path===S.cur?"selected":""}>${esc(p.name)}${p.needs_you?"  ●":""}</option>`).join("") || `<option>No missions yet</option>`;
  if(sel.innerHTML!==opts) sel.innerHTML = opts;
}
async function tick(){
  try{
    await loadProjects();
    const cp = S.projects.find(p=>p.path===S.cur);
    S.st = cp && cp.initialized ? await api("/api/state?p="+encodeURIComponent(S.cur)) : null;
    if(S.view==="tokens") await loadUsage();
    if(S.view==="today") S.today=await api("/api/today").catch(()=>S.today);
    if(S.view==="settings"){ S.notify=await api("/api/notify").catch(()=>S.notify); if(S.st) S.snaps=await api("/api/snapshots?p="+encodeURIComponent(S.cur)).catch(()=>S.snaps); }
    $("offline").style.display="none";
    render();
    if(S.drawer) refreshLog();
  }catch(e){ $("offline").style.display="block"; console.warn(e); }
}
setInterval(tick, 2000);

/* ── phases (dependency gantt) ── */
function schedule(tasks){
  const by=Object.fromEntries(tasks.map(t=>[t.id,t])), start={}, end={};
  const visit=(id,seen)=>{ if(id in end) return end[id]; if(seen.has(id)) return 0; seen.add(id);
    const deps=(by[id].depends_on||[]).filter(d=>by[d]); const s=deps.length?Math.max(...deps.map(d=>visit(d,seen))):0;
    start[id]=s; end[id]=s+Math.max(1,by[id].estimate||1); return end[id]; };
  tasks.forEach(t=>visit(t.id,new Set()));
  const total=Math.max(1,...Object.values(end)), crit=new Set();
  let cur=tasks.filter(t=>end[t.id]===total).map(t=>t.id);
  while(cur.length){ const nx=[]; cur.forEach(id=>{ if(crit.has(id)) return; crit.add(id); (by[id].depends_on||[]).forEach(d=>{ if(by[d]&&end[d]===start[id]) nx.push(d); }); }); cur=nx; }
  return {start,end,total,crit};
}
function viewPhases(){
  const st=S.st; if(!st) return head("Timeline","")+noMission();
  const tasks=st.tasks.filter(t=>t.status!=="cancelled");
  if(!tasks.length) return head("Timeline","")+`<div class="empty">No plan yet. ${st.mission.phase==="briefing"?'Your supervisor is in its briefing. Tell it your goal in <a href="#" data-view="comms">Chat</a>.':"The supervisor hasn't planned any tasks yet."}</div>`;
  const {start,end,total,crit}=schedule(tasks);
  const phases={}; tasks.forEach(t=>(phases[t.phase]=phases[t.phase]||[]).push(t));
  const maxPar = Math.max(...Array.from({length:total},(_,u)=>tasks.filter(t=>start[t.id]<=u&&end[t.id]>u).length));
  const rows=[...tasks].sort((a,b)=>start[a.id]-start[b.id]||a.phase-b.phase||a.id.localeCompare(b.id));
  const W=Math.max(320,($("main").clientWidth||900)-Math.min(64,($("main").clientWidth||900)*.08)-16), mobile=W<700, G=mobile?92:240, RH=48, TOP=30;
  const unit=Math.max(40,(W-G-16)/total), SW=G+unit*total+16, SH=TOP+rows.length*RH+8;
  const y={}; rows.forEach((t,i)=>y[t.id]=TOP+i*RH);
  const S_=s=>`var(--s-${s})`;
  let svg=`<svg class="gantt" width="${SW}" height="${SH}" viewBox="0 0 ${SW} ${SH}" role="img" aria-label="Task dependency timeline">
  <defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" style="fill:var(--dim)"/></marker>
  <marker id="ahc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" style="fill:var(--crit)"/></marker></defs>`;
  rows.forEach((t,i)=>{ if(i) svg+=`<line x1="0" x2="${SW}" y1="${y[t.id]}" y2="${y[t.id]}" style="stroke:var(--line)"/>`; });
  for(let u=0;u<total;u++){ const x=G+u*unit; svg+=`<line x1="${x}" x2="${x}" y1="${TOP-6}" y2="${SH}" style="stroke:var(--line)" stroke-dasharray="2 4"/><text x="${x+6}" y="${TOP-12}" font-size="11" style="fill:var(--dim)">${u+1}</text>`; }
  rows.forEach(t=>(t.depends_on||[]).forEach(d=>{ if(!(d in end)) return;
    const x1=G+end[d]*unit-6, y1=y[d]+RH/2, x2=G+start[t.id]*unit+4, y2=y[t.id]+RH/2, c=crit.has(d)&&crit.has(t.id)&&end[d]===start[t.id];
    const mx=Math.max(12,(x2-x1)/2);
    svg+=`<path d="M${x1} ${y1} C${x1+mx} ${y1},${x2-mx} ${y2},${x2-2} ${y2}" fill="none" style="stroke:${c?"var(--crit)":"var(--dim)"}" stroke-opacity="${c?.85:.6}" stroke-width="1.4" marker-end="url(#${c?"ahc":"ah"})"/>`; }));
  rows.forEach(t=>{

  if(a==="cmd"){ let c; try{ c=JSON.parse(S.drafts["t-cmd"]||"[]"); }catch(e){ return toast('Write it as a JSON list, e.g. ["ollama","run","qwen2.5"]',true); }

function md(s){
  const blocks=[]; s=esc(s).replace(/```([\s\S]*?)```/g,(_,c)=>{blocks.push(c);return `\u0000${blocks.length-1}\u0000`;});
  s=s.split("\n").map(l=>/^#{1,3} /.test(l)?`<h3>${l.replace(/^#+ /,"")}</h3>`:/^\s*[-*] /.test(l)?`<p>• ${l.replace(/^\s*[-*] /,"")}</p>`:l.trim()?`<p>${l}</p>`:"").join("");
  s=s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<pre>${blocks[i]}</pre>`);
}

async function refreshLog(){

  const stick=lb.scrollTop+lb.clientHeight>=lb.scrollHeight-30;
  S._logKey=t.id+"#"+a;

      else d=d.filter(x=>x!==el.dataset.rmdom);
      await post("/api/access",{domains:d}); toast("Saved. Applies from the next agent run"); await tick(); return; }
    if(el.id==="clearBash"){ for(const r of (S.st.mission.permissions?.allow||[]).filter(r=>r.startsWith("Bash("))) await post("/api/permission",{action:"remove",rule:r}); toast("Old command rules cleared"); await tick(); return; }
    if(el.dataset.snap){ const r=el.dataset.snap; S.snapOpen=S.snapOpen===r?null:r; render();
      if(S.snapOpen){ S.snapChanges=S.snapChanges||{}; const res=await api(`/api/snapshot-changes?p=${encodeURIComponent(S.cur)}&ref=${encodeURIComponent(r)}`).catch(e=>{toast(e.message,true); return {changes:[]};}); S.snapChanges={...S.snapChanges,[r]:res.changes}; render(); } return; }
    if(el.dataset.restore){ const path=el.dataset.path, what=path?`“${path}”`:"every file in this snapshot";
      if(!confirm(`Put back ${what} as it was in the snapshot? Your current version is snapshotted first, so you can undo this.`)) return;
      const r=await post("/api/snapshot",{action:"restore",ref:el.dataset.restore,paths:path?[path]:null}); toast(`Restored ${r.restored} file${r.restored===1?"":"s"}`); S.snapChanges={}; S.snapOpen=null; await tick(); return; }
    if(el.id==="snapNow"){ el.disabled=true; el.textContent="Saving…"; const r=await post("/api/snapshot",{action:"take"}).catch(()=>({})); toast(r.taken?"Snapshot saved":"Nothing changed since the last snapshot"); await tick(); return; }
    if(el.dataset.nsave){ const n=el.dataset.nsave, v=(S.drafts["nf-"+n]||"").trim(); if(!v) return toast("Paste the "+(n==="ntfy"?"topic":"URL")+" first",true);
      S.notify=await post("/api/notify",{channels:{[n]:{[n==="ntfy"?"topic":"url"]:v,on:true}}}); S.drafts["nf-"+n]=""; delete S.hashes.main; toast("Saved"); render(); return; }
    if(el.id==="notifyTest"){ const r=await post("/api/notify-test",{}); const bad=Object.entries(r.results).filter(([,v])=>v!=="ok");
      toast(bad.length?bad.map(([k,v])=>k+": "+v).join(" · "):"Test sent via "+Object.keys(r.results).join(", "),bad.length>0); return; }
    if(el.id==="addPerm"){ const v=($("permRule")?.value||"").trim(); if(!v) return toast("Enter a rule, e.g. WebSearch",true); await post("/api/permission",{action:"add",rule:v}); S.drafts.permRule=""; toast("Allowed for this project"); await tick(); return; }
    if(el.dataset.rmperm){ await post("/api/permission",{action:"remove",rule:el.dataset.rmperm}); toast("Removed"); await tick(); return; }
    if(el.id==="ccCopy"){ try{ await navigator.clipboard.writeText(S.st.resume_cmd); toast("Copied. Paste it in a terminal to continue this chat in Claude Code"); }catch(e){ toast("Couldn't access the clipboard",true); } return; }
    if(el.id==="prBtn"){ el.disabled=true; el.textContent="Creating…"; const reset=()=>{ el.disabled=false; el.textContent="Create Pull Request"; };
      const go=async target=>{ const r=await post("/api/pr",target?{target}:{}); toast(r.url?"Pull request created":"Branch pushed"); if(r.url) window.open(r.url,"_blank","noopener"); };
      try{ await go(); }
      catch(err){ const t=err.data?.suggest_target;
        if(t && confirm(`${err.message}\n\nOK opens the pull request against "${t}", containing only this mission's changes.`)){ try{ await go(t); }catch(e2){ toast(e2.message||"Couldn't open the pull request",true); reset(); } }
        else reset(); }
      await tick(); return; }
    if(el.id==="copyBrief"){ const r=await api(`/api/brief?p=${encodeURIComponent(S.cur)}&t=${S.drawer}`); try{ await navigator.clipboard.writeText(r.brief); toast("Brief copied. Paste it to your teammate"); }catch(e){ toast("Couldn't access the clipboard",true); } return; }
    if(el.id==="markDone"){ if(!confirm("Mark this task done? The supervisor will review what was delivered.")) return; await post("/api/done",{t:S.drawer}); toast("Sent to the supervisor for review"); await tick(); return; }
    if(el.id==="sideAdd"){ S.view="overview"; lsSet("mc.view",S.view); render(); setTimeout(()=>{ const i=$("addPath"); i?.scrollIntoView({behavior:"smooth",block:"center"}); i?.focus(); },60); return; }
    if(el.id==="saveModels"){ const mdl=readPicker("md-"); await post("/api/models",mdl); lsSet("mc.models",JSON.stringify(mdl)); ["sr","sm","se","er","em","ee"].forEach(k=>delete S.drafts["md-"+k]); toast("Models saved. Applies to the next supervisor turn and to tasks that haven't run"); await tick(); return; }
    if(el.id==="approveBtn"){ el.disabled=true; const allow=[...document.querySelectorAll(".pp-chk:checked")].map(c=>c.dataset.rule); const r=await post("/api/approve",{allow}); toast("Launched "+(r.launched.join(", ")||"(waiting on dependencies)")); await tick(); return; }
    if(el.id==="supReset"){ await post("/api/supervisor",{reset:true}); toast("Next supervisor turn starts fresh"); await tick(); return; }
    if(el.id==="supTake"){ await post("/api/supervisor",{mode:"dashboard"}); toast("The dashboard now runs the supervisor"); await tick(); return; }
    if(el.dataset.proj){ selectProject(el.dataset.proj); await tick(); return; }
    if(el.dataset.act){ e.stopPropagation();
      if(el.dataset.act==="run"){ const t=S.st?.tasks.find(x=>x.id===el.dataset.t), cap=(S.st?.mission.max_attempts||3)+(t?.attempt_bonus||0), used=t?.attempts?.length||0,
          waiting=(S.st?.questions||[]).some(q=>q.task===el.dataset.t&&q.status==="open"&&q.permission);
        if(t&&used>=cap&&!confirm(`${t.id} has already used ${used} of ${cap} attempts without finishing.\n\nRun it again anyway? Consider changing its model or splitting it first.`)) return;
        if(t&&waiting&&!confirm(`${t.id} is waiting for your decision on a permission request. It will probably hit the same wall.\n\nRun it anyway?`)) return; }
      if(el.dataset.act==="cancel" && !confirm(`Cancel ${el.dataset.t}? A cancelled task can't be run again.`)) return; await post("/api/"+el.dataset.act,{t:el.dataset.t}); toast({run:"Executor launched in a fresh session",stop:"Stopped",cancel:"Cancelled",resume:"Unpaused"}[el.dataset.act]); await tick(); return; }
    if(el.dataset.answer){ await post("/api/answer",{q:el.dataset.answer,answer:el.dataset.val}); toast("Answer sent to supervisor"); await tick(); return; }
    if(el.dataset.answerText){ const id=el.dataset.answerText, v=($("ans-"+id)?.value||"").trim(); if(!v) return toast("Write an answer first",true);
      await post("/api/answer",{q:id,answer:v}); delete S.drafts["ans-"+id]; toast("Answer sent to supervisor"); await tick(); return; }
    if(el.dataset.filter){ S.feedFilter=el.dataset.filter; render(); return; }
    if(el.id==="sendNote"){ const v=($("note-box")?.value||"").trim(); if(!v) return toast("Write a message first",true);
      await post("/api/note",{text:v}); S.drafts.note=""; $("note-box").value=""; toast("Sent. The supervisor reads it at its next step"); await tick(); return; }
    if(el.id==="closeD"||el.id==="scrim"){ closeDrawer(); return; }
    if(el.id==="autoT"){ const on=!S.st.mission.autopilot; await post("/api/autopilot",{on}); toast(on?"Autopilot on: ready tasks launch automatically":"Autopilot off"); await tick(); return; }
    if(el.id==="runReady"){ const r=await post("/api/run-ready",{}); toast(r.launched.length?"Launched "+r.launched.join(", "):"Nothing ready"); await tick(); return; }
    if(el.dataset.task){ openDrawer(el.dataset.task); return; }
  }catch(err){ console.warn(err); }
});
/* Switching project keeps the page you're on (Chat stays Chat, Timeline stays Timeline). From All Projects it opens
   the page you last worked in. Drafts (chat box, notes, rules) belong to a project and never follow you to another. */
const GLOBAL_DRAFTS=["addPath","cloneInto"];
S.draftsBy={}; S.lastView=lsGet("mc.lastview")||"phases";
function selectProject(path, view){
  if(path!==S.cur){
    if(S.cur) S.draftsBy[S.cur]=Object.fromEntries(Object.entries(S.drafts).filter(([k])=>!GLOBAL_DRAFTS.includes(k)));
    const keep=Object.fromEntries(Object.entries(S.drafts).filter(([k])=>GLOBAL_DRAFTS.includes(k)));
    S.drafts={...keep,...(S.draftsBy[path]||{})};
    S.cur=path; lsSet("mc.project",path);
    S.st=null; S.usage=null; S.usageOpen=new Set(); S.usageCalls={}; S.usageFilter="all"; S.logs={}; S.hashes={}; closeDrawer();
  }
  S.usageScope="project";
  S.view = view || (GLOBAL.has(S.view) ? S.lastView : S.view);
  if(!GLOBAL.has(S.view)){ S.lastView=S.view; lsSet("mc.lastview",S.view); }
  lsSet("mc.view",S.view);
}
async function sendChat(){
  S.chatBottom=true;
  const box=$("chat-box"), v=(box?.value||"").trim(); if(!v) return;
  box.value=""; S.drafts.chat="";
  try{ await post("/api/chat",{text:v}); }catch(err){ box.value=v; S.drafts.chat=v; return; }
  await tick();
}
document.addEventListener("keydown", e=>{ if(e.target.id==="permRule" && e.key==="Enter"){ e.preventDefault(); $("addPerm")?.click(); } if(e.target.id==="domIn" && e.key==="Enter"){ e.preventDefault(); $("addDom")?.click(); } if(e.target.id==="chat-box" && e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendChat(); }
  if(e.target.id==="addPath" && e.key==="Enter"){ e.preventDefault(); $("addBtn")?.click(); }
  if((e.target.id==="t-new"||e.target.id==="r-new") && e.key==="Enter"){ e.preventDefault(); document.querySelector(`[data-tact="${e.target.id==="t-new"?"add":"remind"}"]`)?.click(); } });
document.addEventListener("input", e=>{ const k=e.target.dataset?.draft; if(k) S.drafts[k]=e.target.value; if(e.target.id==="chat-box") growBox(e.target);
  if(e.target.id==="addPath"){ const was=S._wasRepo, now=looksRepo(e.target.value); S._wasRepo=now; if(was!==now){ delete S.hashes.main; const pos=e.target.selectionStart; render(); const i=$("addPath"); if(i){ i.focus(); i.setSelectionRange(pos,pos); } } } });
document.addEventListener("change", async e=>{ const t=e.target;
  if(t.dataset?.access){ await post("/api/access",{mode:t.dataset.access}).catch(()=>{}); toast(t.dataset.access==="sandbox"?"Full access inside the project, sandboxed":"Only allowed commands"); return tick(); }
  if(t.dataset?.snapon!==undefined){ await post("/api/snapshot",{action:"toggle",on:t.checked}).catch(()=>{}); return tick(); }
  if(t.dataset?.tdone) return todayPost("item",{id:t.dataset.tdone,patch:{done:t.checked}}).catch(()=>{});
  if(t.dataset?.tmove!==undefined){ await todayPost("suggestion",{id:t.dataset.tmove,action:"move",project:t.value||null}).catch(()=>{}); return toast(t.value?"Moved. Emails from this sender will go there from now on":"Moved"); }
  if(t.dataset?.tmeet!==undefined) return todayPost("config",{config:{meeting_reminder:+t.value}}).then(()=>toast(+t.value?`You'll be pinged ${t.value} min before meetings`:"Meeting pings off")).catch(()=>{});
  if(t.dataset?.tauto!==undefined) return todayPost("config",{config:{auto:t.checked}}).catch(()=>{});
  if(t.dataset?.treader!==undefined){ const [ty,md]=t.value.split(":"); return todayPost("config",{config:{reader:{type:ty,...(md?{model:md}:{})}}}).catch(()=>{}); }
  if(t.dataset?.tprof) return todayPost("config",{config:{profile:{project:t.dataset.tprof,aliases:t.value}}}).then(()=>toast("Saved")).catch(()=>{});
  if(t.dataset?.tnotes!==undefined){ await todayPost("notes",{text:t.value}).catch(()=>{}); delete S.drafts["t-notes"]; return toast("Notes saved"); }
  if(t.dataset?.nmaster!==undefined){ S.notify=await post("/api/notify",{enabled:t.checked}).catch(()=>S.notify); delete S.hashes.main; render(); return; }
  if(t.dataset?.nchan){ S.notify=await post("/api/notify",{channels:{[t.dataset.nchan]:{on:t.checked}}}).catch(e=>{toast(e.message); return S.notify;}); delete S.hashes.main; render(); return; }
  if(t.dataset?.nkind){ S.notify=await post("/api/notify",{kinds:{[t.dataset.nkind]:t.checked}}).catch(()=>S.notify); delete S.hashes.main; render(); return; }
  if(t.dataset?.limit){ const v=Number(t.value), k=t.dataset.limit, body={"lim-att":{max_attempts:v},"lim-bud":{budget:v},"lim-calls":{max_turns:v},"lim-sup":{sup_turns:v}}[k];
    await post("/api/limits",body).catch(()=>{}); toast("Limit saved"); await tick(); return; }
  if(t.dataset?.pick){ S.drafts[t.dataset.draft]=t.value; const sel=$(t.dataset.pick); if(sel){ S.drafts[t.dataset.pick]=""; S.drafts[t.dataset.pick.slice(0,-1)+"e"]=""; delete S.hashes.main; S.drafts[t.dataset.pick+"-x"]=""; renderPickerNow(t.dataset.pick.slice(0,3)); } }
  else if(t.matches?.(".mcell select")){ S.drafts[t.dataset.draft]=t.value; const x=$(t.id+"-x"); if(x){ x.style.display=t.value==="__custom"?"":"none"; if(t.value==="__custom") x.focus(); }
    const h=$(t.id+"-h"); if(h) h.innerHTML=modelHint(t.value,h.dataset.default); delete S.hashes.main; const sx=window.scrollY; render(); } });
function renderPickerNow(){ delete S.hashes.main; render(); }
document.addEventListener("change", async e=>{
  if(e.target.id==="projSel"){ selectProject(e.target.value); await tick(); }
  if(e.target.id==="execSel"){ let to=e.target.value; if(to==="human") return;
    if(to==="__person"){ to=(prompt("GitHub username of the teammate:")||"").trim().replace(/^@/,""); if(!to){ delete S.hashes.drawer; renderDrawer(); return; } }
    await post("/api/assign",{t:S.drawer,to}).catch(()=>{}); toast(e.target.value==="__person"?`Assigned to @${to}`:"Executor changed"); delete S.hashes.drawer; await tick(); }
  if(e.target.id==="attSel"){ S.logAttempt=+e.target.value; delete S.hashes.drawer; S._logHtml=""; await renderDrawer(); refreshLog(); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeDrawer(); });
window.addEventListener("resize", ()=>{ clearTimeout(window._rz); window._rz=setTimeout(render,150); });
api("/api/config").then(c=>{ S.cloneDir=c.clone_dir; }).catch(()=>{});
tick();
</script>
<script>
// Launch sequence (~2.2 s). Click or any key skips it.
(function(){
  var el = document.getElementById("boot"), app = document.querySelector(".app"); if (!el) return;
  var done = false;
  function finish(){
    if (done) return; done = true;
    el.classList.add("out");
    if (app) app.classList.add("reveal");
    setTimeout(function(){ el.remove(); if (app) app.classList.remove("reveal"); }, 950);
  }
  el.addEventListener("click", finish);
  addEventListener("keydown", finish, {once:true});
  setTimeout(finish, 2200);
})();
</script>
